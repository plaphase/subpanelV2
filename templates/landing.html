<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0f18">
  <title>Linebase</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0f18;color:#eef4ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 18% 15%,#14333b 0,transparent 38%),radial-gradient(ellipse at 85% 85%,#25234b 0,transparent 36%),#0a0f18}
    main{width:min(100%,760px);padding:clamp(28px,7vw,64px);border:1px solid #26364b;border-radius:24px;background:#111a27eF;box-shadow:0 28px 90px #0006}
    .brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;letter-spacing:-.04em}
    .mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(140deg,#63dfd0,#8b82ff);color:#111728;font-size:14px}
    .eyebrow{margin-top:48px;color:#72dfd2;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{max-width:590px;margin:12px 0 16px;font-size:clamp(34px,7vw,58px);line-height:1.03;letter-spacing:-.055em}
    p{max-width:520px;margin:0;color:#a5b4c9;font-size:16px;line-height:1.75}
    .actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:32px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;background:linear-gradient(100deg,#61dfd0,#8d82ff);color:#101625;text-decoration:none;font-size:14px;font-weight:800}
    .note{color:#71829b;font-size:12px}
    footer{margin-top:54px;padding-top:18px;border-top:1px solid #253247;color:#71829b;font-size:11px}
    @media(max-width:520px){main{border-radius:18px}.eyebrow{margin-top:36px}.actions{align-items:stretch;flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">LB</span><span>Linebase</span></div>
    <div class="eyebrow">Личная инфраструктура</div>
    <h1>Добро пожаловать.</h1>
    <p>Служебная информационная страница Linebase. Для владельца доступен отдельный административный вход.</p>
    <div class="actions">
      <a class="button" href="https://panel.linebase.ru/login">Войти в кабинет <span aria-hidden="true">&nbsp;↗</span></a>
      <span class="note">Вход доступен владельцу сервиса.</span>
    </div>
    <footer>Linebase · личная инфраструктура</footer>
  </main>
</body>
</html>
