<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результат добавления</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: #0b0f17;
    color: #f3f6fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
.card {
    width: min(100%, 520px);
    padding: 28px;
    border: 1px solid #273246;
    border-radius: 18px;
    background: #151b27;
}
h1 { margin-top: 0; font-size: 24px; }
.stat {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid #273246;
}
.value { font-weight: 700; color: #36d399; }
.muted { color: #9ca8ba; }
button {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #5b8cff;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
</style>



<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="stylesheet" href="{{ url_for('static', filename='panel-v2.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='panel-cosmic.css', v=4) }}">
<script defer src="{{ url_for('static', filename='panel-v2.js') }}"></script>
</head>
<body>
<div class="card">
    <h1>Результат добавления</h1>

    <div class="stat">
        <span>Добавлено источников</span>
        <span class="value">{{ added }}</span>
    </div>

    <div class="stat">
        <span>Пропущено дубликатов</span>
        <span>{{ skipped }}</span>
    </div>

    <div class="stat">
        <span>Затронуто пользователей</span>
        <span>{{ affected_users }}</span>
    </div>

    {% if affected_names %}
    <p class="muted">Пользователи:</p>
    <ul>
        {% for name in affected_names %}
        <li>{{ name }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <button onclick="location.href='/bulk'">
        Вернуться к массовому управлению
    </button>
</div>
</body>
</html>
