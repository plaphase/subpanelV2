<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title> </title>

    <style>
        :root {
            color-scheme: dark;
            --night: #08090b;
            --paper: #eff0f1;
            --quiet: #97999d;
            --line: rgba(229, 232, 236, .23);
        }

        * { box-sizing: border-box; }

        html, body { min-width: 320px; min-height: 100%; margin: 0; }

        body {
            overflow-x: hidden;
            background: var(--night);
            color: var(--paper);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .scene {
            position: relative;
            isolation: isolate;
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 48% 43%, rgba(118, 121, 126, .08), transparent 45%),
                radial-gradient(ellipse at 67% 70%, rgba(84, 87, 93, .08), transparent 38%),
                #08090b;
        }

        #particles {
            position: absolute;
            z-index: -1;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .fog {
            position: absolute;
            z-index: -1;
            inset: -20%;
            pointer-events: none;
            opacity: .45;
            background:
                radial-gradient(ellipse at 27% 46%, rgba(171, 174, 180, .095), transparent 20%),
                radial-gradient(ellipse at 73% 28%, rgba(136, 140, 149, .07), transparent 24%),
                radial-gradient(ellipse at 54% 78%, rgba(109, 112, 119, .065), transparent 27%);
            filter: blur(44px);
            animation: fog-drift 28s ease-in-out infinite alternate;
        }

        .orbit {
            position: absolute;
            z-index: -1;
            top: 50%;
            left: 50%;
            width: min(72vw, 720px);
            aspect-ratio: 1;
            border: 1px solid rgba(225, 228, 232, .065);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-18deg);
            box-shadow: 0 0 0 54px rgba(215, 218, 224, .013), 0 0 0 119px rgba(215, 218, 224, .009), inset 0 0 90px rgba(226, 229, 234, .025);
            animation: orbit-breathe 19s ease-in-out infinite alternate;
        }

        .orbit::before,
        .orbit::after {
            position: absolute;
            content: "";
            inset: 22% -31%;
            border: 1px solid rgba(222, 226, 232, .12);
            border-radius: 50%;
            transform: rotate(35deg);
        }

        .orbit::after {
            inset: 9% -44%;
            border-color: rgba(205, 209, 217, .075);
            transform: rotate(-21deg);
        }

        .dust {
            position: absolute;
            z-index: 0;
            top: 17%;
            right: 9%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e2e4e8;
            box-shadow: 0 0 18px 4px rgba(225, 228, 232, .34);
            animation: dust-float 8s ease-in-out infinite;
        }

        .form {
            position: relative;
            z-index: 2;
            width: min(100% - 42px, 300px);
            margin-top: 10vh;
            padding: 22px 4px;
            animation: arrive 1.1s .15s both cubic-bezier(.2, .7, .2, 1);
        }

        .error {
            margin: 0 0 25px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 131, 146, .54);
            color: #ff9aa7;
            font-size: 13px;
        }

        .field { margin-bottom: 26px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c6c8cc;
            font-size: 11px;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        input {
            display: block;
            width: 100%;
            min-height: 39px;
            padding: 7px 2px;
            border: 0;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            outline: 0;
            background: transparent;
            color: var(--paper);
            font: inherit;
            font-size: 15px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        input:focus {
            border-color: rgba(247, 248, 250, .85);
            box-shadow: 0 1px 0 rgba(247, 248, 250, .85);
        }

        button {
            display: flex;
            align-items: center;
            gap: 13px;
            min-height: 42px;
            margin: 35px 0 0 auto;
            padding: 0 2px 0 10px;
            border: 0;
            background: transparent;
            color: #e6e7e9;
            font: inherit;
            font-size: 12px;
            letter-spacing: .12em;
            cursor: pointer;
            transition: color .2s ease, transform .2s ease;
        }

        button:hover { color: #fff; transform: translateX(3px); }

        .arrow {
            display: grid;
            width: 28px;
            height: 28px;
            place-items: center;
            border: 1px solid rgba(229, 232, 236, .28);
            border-radius: 50%;
            font-size: 16px;
            line-height: 1;
            letter-spacing: 0;
        }

        @keyframes fog-drift {
            from { transform: translate3d(-2%, -1%, 0) scale(.98); }
            to { transform: translate3d(2%, 1%, 0) scale(1.05); }
        }

        @keyframes orbit-breathe {
            from { opacity: .65; transform: translate(-50%, -50%) rotate(-21deg) scale(.97); }
            to { opacity: 1; transform: translate(-50%, -50%) rotate(-15deg) scale(1.025); }
        }

        @keyframes dust-float {
            0%, 100% { transform: translate3d(0, 0, 0); opacity: .42; }
            50% { transform: translate3d(-12px, 17px, 0); opacity: .95; }
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .orbit { top: 38%; left: 50%; width: min(115vw, 520px); }
            .form { margin-top: 23vh; }
            .dust { top: 13%; right: 15%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

<body>
    <main class="scene">
        <canvas id="particles" aria-hidden="true"></canvas>
        <div class="fog" aria-hidden="true"></div>
        <div class="orbit" aria-hidden="true"></div>
        <div class="dust" aria-hidden="true"></div>

        <form class="form" method="POST" action="{{ url_for('login') }}" aria-label="Форма авторизации">
            {{ csrf_input() }}
            <input type="hidden" name="next" value="{{ next }}">

            {% if error %}
                <div class="error" role="alert">{{ error }}</div>
            {% endif %}

            <div class="field">
                <label for="username">Логин</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="field">
                <label for="password">Пароль</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit"><span>ПРОДОЛЖИТЬ</span><span class="arrow" aria-hidden="true">↗</span></button>
        </form>
    </main>

    <script>
        (() => {
            const canvas = document.getElementById("particles");
            const context = canvas && canvas.getContext("2d", { alpha: true });
            if (!context) return;

            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const pointer = { x: 0, y: 0, targetX: 0, targetY: 0 };
            const particles = [];
            let width = 0;
            let height = 0;
            let ratio = 1;
            let frame = 0;

            function resize() {
                ratio = Math.min(window.devicePixelRatio || 1, 1.5);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.round(width * ratio);
                canvas.height = Math.round(height * ratio);
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                context.setTransform(ratio, 0, 0, ratio, 0, 0);

                const count = Math.min(150, Math.max(65, Math.round((width * height) / 8500)));
                particles.length = 0;
                for (let index = 0; index < count; index += 1) {
                    const depth = Math.random() * .8 + .2;
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        depth,
                        radius: Math.random() * 1.15 + .25,
                        alpha: Math.random() * .4 + .12,
                        speed: (Math.random() * .16 + .035) * depth,
                        drift: (Math.random() - .5) * .06,
                    });
                }
                paint(0, !reducedMotion);
            }

            function paint(time, move = true) {
                context.clearRect(0, 0, width, height);
                pointer.x += (pointer.targetX - pointer.x) * .025;
                pointer.y += (pointer.targetY - pointer.y) * .025;

                for (const particle of particles) {
                    if (move) {
                        particle.y -= particle.speed;
                        particle.x += particle.drift + pointer.x * particle.depth * .000035;
                        if (particle.y < -4) { particle.y = height + 4; particle.x = Math.random() * width; }
                        if (particle.x < -4) particle.x = width + 4;
                        if (particle.x > width + 4) particle.x = -4;
                    }

                    const x = particle.x + pointer.x * particle.depth * .012;
                    const y = particle.y + pointer.y * particle.depth * .012;
                    context.fillStyle = `rgba(235, 238, 243, ${particle.alpha})`;
                    context.beginPath();
                    context.arc(x, y, particle.radius * particle.depth, 0, Math.PI * 2);
                    context.fill();

                    if (particle.depth > .78 && particle.radius > 1) {
                        context.strokeStyle = `rgba(225, 229, 236, ${particle.alpha * .22})`;
                        context.beginPath();
                        context.moveTo(x, y);
                        context.lineTo(x, y + 12 + particle.depth * 18);
                        context.stroke();
                    }
                }

                if (move && !document.hidden) frame = window.requestAnimationFrame(paint);
            }

            window.addEventListener("resize", resize, { passive: true });
            window.addEventListener("pointermove", (event) => {
                pointer.targetX = event.clientX - width / 2;
                pointer.targetY = event.clientY - height / 2;
            }, { passive: true });
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) window.cancelAnimationFrame(frame);
                else if (!reducedMotion) frame = window.requestAnimationFrame(paint);
            });
            resize();
        })();
    </script>
</body>
</html>
