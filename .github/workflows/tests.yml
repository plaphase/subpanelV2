name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n install.sh installer/install.sh installer/preflight.sh installer/run-panel.sh installer/select-mode.sh installer/lib/*.sh
      - run: sudo bash tests/test_installer_paths.sh
      - run: sudo bash tests/test_create_config.sh
      - run: sudo bash tests/test_install_flow.sh
